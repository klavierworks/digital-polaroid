[platformio]
default_envs = qualia_s3

[env:qualia_s3]
platform = https://github.com/pioarduino/platform-espressif32.git#54.03.21
framework = arduino
board = adafruit_qualia_s3_rgb666
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D BOARD_HAS_PSRAM
    -D NO_SIMD
lib_deps =
    moononournation/GFX Library for Arduino@1.6.6
    https://github.com/bitbank2/JPEGDEC.git#1.6.2
    bblanchon/ArduinoJson@^7.2.0
